[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "picograd"
version = "0.3.1"
authors = [
  {name = "Dmitry Vyal", email = "dmitryvyal@gmail.com"},
]
description = "A simplistic and easily-customizable framework for running experiments with pytorch"
requires-python = ">=3.8"
license = "MIT"
license-files = ["LICENSE.TXT"]
readme = "README.md"
keywords = ["pytorch", "experiment", "history"]
classifiers = [
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Scientific/Engineering :: Mathematics",
  "Programming Language :: Python :: 3",
]
dynamic = ["dependencies"]

[project.scripts]
picorun = "picograd.run:main"

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.packages.find]
where=['src']
#include=["picograd", "configs", "utils"]
#[tool.setuptools]
#packages = ["picograd"]

[project.optional-dependencies]
test = [
    "pytest >= 8"
    ]

[tool.pytest.ini_options]
minversion = "8"
#addopts = "-ra -q"
testpaths = [
    "tests",
]
